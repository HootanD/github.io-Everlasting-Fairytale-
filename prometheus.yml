global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: 'production'
    service: 'everlasting-fairytale'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/prometheus-alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node-app:8080']
        labels:
          service: 'everlasting-fairytale'
          env: 'production'

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
      
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
