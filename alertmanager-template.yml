# Alertmanager Configuration with Slack & PagerDuty Integration
# 
# SETUP INSTRUCTIONS:
# 1. Follow SLACK_PAGERDUTY_SETUP.md to get your webhook URLs
# 2. Replace YOUR_* placeholders below with actual values
# 3. Uncomment the integrations you want to enable
# 4. Run: docker restart alertmanager

global:
  resolve_timeout: 5m
  # Optional: Set default Slack webhook (can override per-receiver)
  # slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_URL'

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  
  routes:
    # Critical alerts - route to PagerDuty + Slack
    - match:
        severity: critical
      receiver: 'critical-notify'
      group_wait: 5s
      repeat_interval: 4h
      
    # Warning alerts - route to Slack
    - match:
        severity: warning
      receiver: 'slack-warning'
      group_wait: 30s
      repeat_interval: 8h
      
    # Info alerts - silent by default
    - match:
        severity: info
      receiver: 'default'

receivers:
  # Default receiver (no notifications)
  - name: 'default'

  # ==================== SLACK CONFIGURATION ====================
  
  # Critical severity alerts
  - name: 'critical-notify'
    slack_configs:
      # ⚠️ REQUIRED: Replace with your Slack webhook URL for #critical-alerts
      # Get it from: https://api.slack.com/apps → Your App → Incoming Webhooks
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_CRITICAL'
        channel: '#critical-alerts'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Service:* {{ .GroupLabels.service }}
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: 'danger'
        actions:
          - type: button
            text: 'View Prometheus'
            url: 'http://localhost:9090/graph'
          - type: button
            text: 'View Alertmanager'
            url: 'http://localhost:9093'
        footer: 'Everlasting Fairytale | Prometheus Alertmanager'
        ts: '{{ (index .Alerts 0).StartsAt.Unix }}'
        
      # Optional: Also send to #ops-on-call
      # - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_ONCALL'
      #   channel: '#ops-on-call'
      #   title: '🚨 {{ .GroupLabels.alertname }}'
      #   text: 'Critical alert in {{ .GroupLabels.service }}'

  # Warning severity alerts
  - name: 'slack-warning'
    slack_configs:
      # ⚠️ REQUIRED: Replace with your Slack webhook URL for #warnings
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_WARNING'
        channel: '#warnings'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: |
          *Service:* {{ .GroupLabels.service }}
          *Alert:* {{ .GroupLabels.alertname }}
          
          {{ range .Alerts }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: 'warning'

  # ==================== PAGERDUTY CONFIGURATION ====================
  
  # Critical alerts to PagerDuty (with Slack notification above)
  - name: 'critical-pagerduty'
    pagerduty_configs:
      # ⚠️ REQUIRED: Replace with your PagerDuty Integration Key
      # Get it from: PagerDuty App → Services → Your Service → Integrations
      - service_key: 'YOUR_PAGERDUTY_INTEGRATION_KEY'
        description: '{{ .GroupLabels.alertname }} [{{ .CommonLabels.severity }}]'
        details:
          firing: |
            {{ range .Alerts.Firing }}
            {{ .Labels.alertname }}: {{ .Annotations.description }}
            {{ end }}
          resolved: |
            {{ range .Alerts.Resolved }}
            {{ .Labels.alertname }}: RESOLVED
            {{ end }}
          service: '{{ .GroupLabels.service }}'
          environment: '{{ .CommonLabels.environment }}'
          cluster: '{{ .GroupLabels.cluster }}'
        client: 'Prometheus Alertmanager'
        client_url: 'http://localhost:9093'
        links:
          - href: 'http://localhost:9090/graph'
            text: 'View Metrics in Prometheus'
          - href: 'http://localhost:9093'
            text: 'View in Alertmanager'
        severity: 'critical'

inhibit_rules:
  # If critical alert fires, suppress warnings for same alert/service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # If warning fires, suppress info alerts
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service']

