name: Production Deployment with Approval

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (leave empty for latest)'
        required: false
        type: string
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        type: choice
        options:
          - rolling
          - blue-green
          - canary
      auto_rollback:
        description: 'Enable automatic rollback on failure'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read
  deployments: write

jobs:
  validate-image:
    runs-on: ubuntu-latest
    outputs:\n      image-tag: ${{ steps.validate.outputs.image-tag }}\n    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate image exists
        id: validate
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="latest"
          fi
          
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          echo "Validating image: ${IMAGE}"
          
          docker pull "${IMAGE}"
          if [ $? -eq 0 ]; then
            echo "Image validation passed"
            echo "image-tag=${IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "Image not found: ${IMAGE}"
            exit 1
          fi

  security-approval:
    runs-on: ubuntu-latest
    needs: validate-image
    environment: production-approval
    steps:
      - name: Wait for approval
        run: echo "Deployment approved by maintainer. Proceeding with ${{ github.event.inputs.deployment_strategy }} strategy..."
      
      - name: Log approval
        run: |
          echo "Approved deployment:"
          echo "  Image: ${{ needs.validate-image.outputs.image-tag }}"
          echo "  Strategy: ${{ github.event.inputs.deployment_strategy }}"
          echo "  Rollback: ${{ github.event.inputs.auto_rollback }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [validate-image, security-approval]
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy using ${{ github.event.inputs.deployment_strategy }} strategy
        run: |
          IMAGE_TAG="${{ needs.validate-image.outputs.image-tag }}"
          STRATEGY="${{ github.event.inputs.deployment_strategy }}"
          
          echo "Deploying image: ${IMAGE_TAG}"
          echo "Using strategy: ${STRATEGY}"
          
          # Add your deployment logic here (kubectl, docker stack, etc.)
          # Example:
          # kubectl set image deployment/app app=${IMAGE_TAG} -n production
      
      - name: Wait for deployment stability
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          # Add health checks here
          echo "Deployment health check passed"
      
      - name: Create deployment record
        run: |
          echo "Deployment completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Image: ${{ needs.validate-image.outputs.image-tag }}"
          echo "Strategy: ${{ github.event.inputs.deployment_strategy }}"

  rollback:
    runs-on: ubuntu-latest
    needs: [validate-image, deploy]
    if: failure() && github.event.inputs.auto_rollback == 'true'
    steps:
      - name: Trigger rollback
        run: |
          echo "ERROR: Deployment failed. Initiating automatic rollback..."
          # Add rollback logic here
          echo "Rollback completed"
      
      - name: Notify team
        run: echo "ALERT: Deployment of ${{ needs.validate-image.outputs.image-tag }} failed and was rolled back"
