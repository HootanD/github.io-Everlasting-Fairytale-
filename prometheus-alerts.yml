groups:
  - name: everlasting_fairytale_alerts
    interval: 30s
    rules:
      # ==================== INFRASTRUCTURE ALERTS ====================
      
      - alert: ServiceDown
        expr: up{job="node-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: everlasting-fairytale
        annotations:
          summary: "Everlasting Fairytale service is down"
          description: "The everlasting-fairytale service has been unreachable for more than 1 minute"
          
      - alert: HighErrorRate
        expr: (rate(http_errors_total[5m]) / rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          
      - alert: CriticalErrorRate
        expr: (rate(http_errors_total[5m]) / rate(http_requests_total[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
          service: everlasting-fairytale
        annotations:
          summary: "Critical error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 10%)"
          
      # ==================== PERFORMANCE ALERTS ====================
      
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "High P95 latency detected"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 1s)"
          
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "High P99 latency detected"
          description: "P99 latency is {{ $value | humanizeDuration }} (threshold: 2s)"
          
      - alert: CriticalLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: critical
          service: everlasting-fairytale
        annotations:
          summary: "Critical latency threshold exceeded"
          description: "P99 latency is {{ $value | humanizeDuration }} (critical threshold: 5s)"
          
      # ==================== BUSINESS METRICS ALERTS ====================
      
      - alert: HighProcessingQueueSize
        expr: processing_queue_size > 100
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "Processing queue is growing"
          description: "Current queue size: {{ $value }} items (threshold: 100)"
          
      - alert: CriticalProcessingQueueSize
        expr: processing_queue_size > 500
        for: 2m
        labels:
          severity: critical
          service: everlasting-fairytale
        annotations:
          summary: "Critical processing queue buildup"
          description: "Queue size: {{ $value }} items (critical threshold: 500)"
          
      - alert: LowSLACompliance
        expr: sla_compliance_percentage{service_level="standard"} < 95
        for: 10m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "Standard SLA compliance below threshold"
          description: "Current compliance: {{ $value }}% (threshold: 95%)"
          
      - alert: CriticalSLACompliance
        expr: sla_compliance_percentage{service_level="premium"} < 99
        for: 5m
        labels:
          severity: critical
          service: everlasting-fairytale
        annotations:
          summary: "Premium SLA compliance critically low"
          description: "Current compliance: {{ $value }}% (threshold: 99%)"
          
      - alert: HighErrorRatePercentage
        expr: error_rate_percentage > 5
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "Error rate percentage high"
          description: "Current error rate: {{ $value }}% (threshold: 5%)"
          
      - alert: CriticalErrorRatePercentage
        expr: error_rate_percentage > 10
        for: 2m
        labels:
          severity: critical
          service: everlasting-fairytale
        annotations:
          summary: "Critical error rate percentage"
          description: "Current error rate: {{ $value }}% (critical threshold: 10%)"
          
      # ==================== RESOURCE ALERTS ====================
      
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 256
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage: {{ $value | humanize }}MB (threshold: 256MB)"
          
      - alert: CriticalMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 512
        for: 2m
        labels:
          severity: critical
          service: everlasting-fairytale
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage: {{ $value | humanize }}MB (critical threshold: 512MB)"
          
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage: {{ $value | humanizePercentage }} (threshold: 80%)"
          
      # ==================== OPERATION-SPECIFIC ALERTS ====================
      
      - alert: BusinessOperationFailureRate
        expr: (rate(business_operations_total{result="failed"}[5m]) / rate(business_operations_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "High business operation failure rate"
          description: "Failure rate: {{ $value | humanizePercentage }} (threshold: 5%)"
          
      - alert: OperationLatencyHigh
        expr: histogram_quantile(0.95, rate(business_operation_duration_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
          service: everlasting-fairytale
        annotations:
          summary: "Business operation latency high"
          description: "P95 operation latency: {{ $value | humanizeDuration }} (threshold: 3s)"
          
      - alert: NoActiveUsers
        expr: active_users_gauge == 0
        for: 15m
        labels:
          severity: info
          service: everlasting-fairytale
        annotations:
          summary: "No active users detected"
          description: "Active user count has been 0 for 15 minutes"
          
      # ==================== SYSTEM/PROMETHEUS ALERTS ====================
      
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
          component: prometheus
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus has been unreachable for more than 1 minute"
          
      - alert: JaegerDown
        expr: up{job="jaeger"} == 0
        for: 2m
        labels:
          severity: warning
          component: jaeger
        annotations:
          summary: "Jaeger tracing service is down"
          description: "Jaeger has been unreachable for more than 2 minutes"
